service: dru-bos-restaurante
frameworkVersion: '3'

provider:
  name: aws
  region: af-south-1
  stage: ${opt:stage, 'dev'}
  runtime: nodejs20.x
  architecture: arm64
  environment:
    NODE_ENV: ${sls:stage}
    SERVICE_NAME: dru-bos-restaurante
    RESTAURANTE_TABLE: ${cf:dru-bos-infra-${sls:stage}.RestauranteTableName}
    STOCK_TABLE: ${cf:dru-bos-infra-${sls:stage}.StockTableName}
    FATURACAO_TABLE: ${cf:dru-bos-infra-${sls:stage}.FaturacaoTableName}
    EVENT_BUS_NAME: ${cf:dru-bos-infra-${sls:stage}.EventBusName}
  iam:
    role:
      statements:
        - Effect: Allow
          Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query, dynamodb:TransactWriteItems]
          Resource:
            - arn:aws:dynamodb:af-south-1:*:table/${cf:dru-bos-infra-${sls:stage}.RestauranteTableName}
            - arn:aws:dynamodb:af-south-1:*:table/${cf:dru-bos-infra-${sls:stage}.StockTableName}
            - arn:aws:dynamodb:af-south-1:*:table/${cf:dru-bos-infra-${sls:stage}.FaturacaoTableName}
            - arn:aws:dynamodb:af-south-1:*:table/${cf:dru-bos-infra-${sls:stage}.AuditoriaTableName}

plugins: [serverless-esbuild]
custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node20

functions:
  abrirCaixa:
    handler: src/handlers/caixas.abrir
    events:
      - http:
          path: /restaurante/caixas
          method: post
          cors: true
          authorizer:
            name: CognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${cf:dru-bos-infra-${sls:stage}.CognitoUserPoolArn}
  listarCaixas:
    handler: src/handlers/caixas.listar
    events:
      - http:
          path: /restaurante/caixas
          method: get
          cors: true
          authorizer:
            name: CognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${cf:dru-bos-infra-${sls:stage}.CognitoUserPoolArn}
  movimentarCaixa:
    handler: src/handlers/caixas.movimentar
    events:
      - http:
          path: /restaurante/caixas/{id}/movimentos
          method: post
          cors: true
          authorizer:
            name: CognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${cf:dru-bos-infra-${sls:stage}.CognitoUserPoolArn}
  fecharCaixa:
    handler: src/handlers/caixas.fechar
    events:
      - http:
          path: /restaurante/caixas/{id}/fecho
          method: post
          cors: true
          authorizer:
            name: CognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${cf:dru-bos-infra-${sls:stage}.CognitoUserPoolArn}
  criarMesa:
    handler: src/handlers/operacao.criarMesa
    events:
      - http:
          path: /restaurante/mesas
          method: post
          cors: true
          authorizer:
            name: CognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${cf:dru-bos-infra-${sls:stage}.CognitoUserPoolArn}
  listarMesas:
    handler: src/handlers/operacao.listarMesas
    events:
      - http:
          path: /restaurante/mesas
          method: get
          cors: true
          authorizer:
            name: CognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${cf:dru-bos-infra-${sls:stage}.CognitoUserPoolArn}
  abrirPedido:
    handler: src/handlers/operacao.abrirPedido
    events:
      - http:
          path: /restaurante/pedidos
          method: post
          cors: true
          authorizer:
            name: CognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${cf:dru-bos-infra-${sls:stage}.CognitoUserPoolArn}
  adicionarLinhaPedido:
    handler: src/handlers/operacao.adicionarLinha
    events:
      - http:
          path: /restaurante/pedidos/{id}/linhas
          method: post
          cors: true
          authorizer:
            name: CognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${cf:dru-bos-infra-${sls:stage}.CognitoUserPoolArn}
  alterarEstadoPedido:
    handler: src/handlers/operacao.alterarEstado
    events:
      - http:
          path: /restaurante/pedidos/{id}/estado
          method: post
          cors: true
          authorizer:
            name: CognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${cf:dru-bos-infra-${sls:stage}.CognitoUserPoolArn}
  fecharPedido:
    handler: src/handlers/operacao.fecharPedido
    events:
      - http:
          path: /restaurante/pedidos/{id}/fecho
          method: post
          cors: true
          authorizer:
            name: CognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${cf:dru-bos-infra-${sls:stage}.CognitoUserPoolArn}
  faturarPedido:
    handler: src/handlers/operacao.faturarPedido
    events:
      - http:
          path: /restaurante/pedidos/{id}/faturar
          method: post
          cors: true
          authorizer:
            name: CognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${cf:dru-bos-infra-${sls:stage}.CognitoUserPoolArn}
  filaCozinha:
    handler: src/handlers/analise.filaCozinha
    events:
      - http:
          path: /restaurante/cozinha/fila
          method: get
          cors: true
          authorizer:
            name: CognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${cf:dru-bos-infra-${sls:stage}.CognitoUserPoolArn}
  relatorioVendas:
    handler: src/handlers/analise.relatorioVendas
    events:
      - http:
          path: /restaurante/relatorios/vendas
          method: get
          cors: true
          authorizer:
            name: CognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${cf:dru-bos-infra-${sls:stage}.CognitoUserPoolArn}
